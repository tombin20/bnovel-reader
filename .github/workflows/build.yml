name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bnovel-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Tạo Release để app tự kiểm tra bản mới (tag v2.<số lần chạy>, khớp versionName)
      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bnovel-reader.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: B-novel Reader 2.${{ github.run_number }}
          files: bnovel-reader.apk
          body_path: RELEASE_NOTES.md   # nội dung này hiện trong hộp thoại cập nhật của app
