plugins { id 'com.android.application' }
// Số bản build lấy từ GitHub Actions (mỗi lần chạy +1) -> versionName "2.<số>", trùng tên tag của Release
def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()

android {
    namespace 'com.bnovel.reader'
    compileSdk 34
    defaultConfig {
        applicationId 'com.bnovel.reader'
        minSdk 29
        targetSdk 34
        versionCode 100 + runNo
        versionName "2." + runNo
    }
    // Ký bằng keystore cố định trong repo: mọi bản build cùng chữ ký nên cài đè (cập nhật) được.
    // Keystore này công khai theo repo (giống debug.keystore thường), chỉ dùng cho app cá nhân.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
