<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B-novel</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="main">
    <header id="top"><b id="ttl">B-novel</b><button id="syncb" hidden aria-label="Đồng bộ">⟳</button></header>
    <div id="view"></div>
    <div id="mini" hidden><div class="mt"><b id="mt1"></b><small id="mt2"></small></div><button id="mpl">⏸</button><button id="mx">✕</button></div>
    <nav id="tabs">
      <button data-tab="lib" aria-label="Tủ sách"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5.3 8.3 4.7 5 4.7v13.6c3.3 0 5.5.6 7 1.8 1.5-1.2 3.7-1.8 7-1.8V4.7c-3.3 0-5.5.6-7 1.8zM12 6.5v13.6"/></svg></span><span class="lb">Tủ sách</span></button>
      <button data-tab="home" aria-label="Khám phá"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2z"/></svg></span><span class="lb">Khám phá</span></button>
      <button data-tab="genre" aria-label="Thể loại"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg></span><span class="lb">Thể loại</span></button>
      <button data-tab="stat" aria-label="Thống kê"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V4M18 20v-6"/></svg></span><span class="lb">Thống kê</span></button>
      <button data-tab="set" aria-label="Cài đặt"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span><span class="lb">Cài đặt</span></button>
    </nav>
  </div>
</div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
